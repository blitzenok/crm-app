<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="manifest" href="/crm/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BioLabs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1B2A4A">
  <link rel="apple-touch-icon" href="/crm/assets/biolabs-logo.png">
  <link rel="icon" href="/crm/assets/biolabs-logo.png">
<title>BioLabs Research</title>
<link rel="stylesheet" href="crm.css?v=05fa5a1bda">
<style>
/* account-statement-only styling; everything shared lives in crm.css */
.content{ flex:1; overflow-y:auto; padding:20px 24px; max-width:720px; }
.card{background:#fff;border:1px solid #E8ECF4;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
.filter-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;}
.form-group label{display:block;font-size:11px;font-weight:600;color:#5A6685;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
.form-group input{width:100%;padding:10px 12px;border:1px solid #E8ECF4;border-radius:8px;font-size:13px;background:#F8FAFF;}
.btn{ padding:10px 18px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:none; }
.btn-primary{ background:linear-gradient(135deg,#1F7A3D,#1B2A4A); color:#fff; }
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.stat-card{background:#fff;border:1px solid #E8ECF4;border-radius:12px;padding:16px 18px;text-align:center;}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:16px;}
.stat-label{font-size:11px;color:#5A6685;font-weight:600;text-transform:uppercase;}
.stat-value{font-size:20px;font-weight:800;margin-top:4px;}
.statement-header{background:linear-gradient(135deg,#1F7A3D,#145C2C);color:#fff;border-radius:14px 14px 0 0;padding:18px 20px;text-align:center;}
.statement-header h2{font-size:18px;}
.statement-header p{font-size:12px;opacity:0.9;margin-top:4px;}
.statement-body{background:#fff;border:1px solid #E8ECF4;border-top:none;border-radius:0 0 14px 14px;padding:18px 20px;}
.cust-details{font-size:13px;line-height:1.8;margin-bottom:16px;}
thead th{background:#1B2A4A;color:#fff;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;}
tbody td{padding:10px 12px;border-bottom:1px solid #E8ECF4;font-size:13px;}
tfoot td{padding:12px;font-weight:800;font-size:14px;border-top:2px solid #1B2A4A;}
.empty-state{text-align:center;color:#5A6685;padding:40px;}
:root{--navy:#1B2A4A;--green:#1F7A3D;--bg:#F8FAFC;--border:#CBD5E1;--text:#0F172A;--muted:#475569;}
/* page-only mobile rules (the shared mobile layout is in crm.css) */
@media(max-width:768px){
.stats-grid,.kpi-grid,.metrics-grid,.stats-row,.kpi-row,.stat-row,.cards-row{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important;}
.filter-row{grid-template-columns:1fr!important;}
.stats-grid{grid-template-columns:1fr 1fr!important;}
}
</style>

</head>
<body>

<div class="app-wrapper">
  <div class="sidebar">
    <div id="crm-nav" class="crm-nav"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <a href="/crm/customers.html" style="text-decoration:none;color:#5A6685;font-size:18px;">←</a>
      <div class="topbar-title">Account Statement</div>
    </div>
    <div class="content">

      <div class="card">
        <div class="filter-row">
          <div class="form-group"><label>From</label><input type="date" id="fromDate"></div>
          <div class="form-group"><label>To</label><input type="date" id="toDate"></div>
          <button class="btn btn-primary" onclick="loadStatement()">🔍 Filter</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Total Transactions</div><div class="stat-value" id="statTx">0</div></div>
        <div class="stat-card"><div class="stat-label">Total Amount</div><div class="stat-value" id="statAmt">$0.00</div></div>
      </div>

      <div class="statement-header">
        <h2 id="stCustomerName">Customer</h2>
        <p>Account Statement</p>
        <p id="stPeriod">-</p>
      </div>
      <div class="statement-body">
        <div class="cust-details" id="custDetails">Loading...</div>
        <table>
          <thead><tr><th>#</th><th>Date</th><th>Invoice</th><th>Total</th><th>Due</th></tr></thead>
          <tbody id="txBody"><tr><td colspan="5" class="empty-state">Loading...</td></tr></tbody>
          <tfoot><tr><td colspan="3">Total</td><td id="foothTotal">$0.00</td><td id="footDue">$0.00</td></tr></tfoot>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="crm-utils.js"></script>
<script src="crm.js?v=d91d6eb09f"></script>
<script src="auth.js"></script>
<script>
renderNav('account-statement');
const API = '/msolpeptides-api';



function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

const customerId = getParam('customer') || 'walkin';

// Default range: last 6 months to today
const today = new Date();
const sixMonthsAgo = new Date(today.getFullYear(), today.getMonth() - 6, today.getDate());
document.getElementById('fromDate').value = sixMonthsAgo.toISOString().slice(0,10);
document.getElementById('toDate').value = today.toISOString().slice(0,10);

async function loadStatement() {
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;
  // Phase 5 (2026-09-05): through api() from crm.js. The page keeps its own message in the table, so api() is asked
  // not to toast ({toast:false}) and every failure lands in the catch below.
  try {
    const data = await api(`${API}/customers/${encodeURIComponent(customerId)}/statement?from=${from}&to=${to}`, {toast:false});
    const c = data.customer;

    document.getElementById('statTx').textContent = data.total_transactions;
    document.getElementById('statAmt').textContent = '$' + data.total_amount.toFixed(2);
    document.getElementById('stCustomerName').textContent = c.name;
    document.getElementById('stPeriod').textContent = new Date(from).toLocaleDateString('en-US',{month:'short',year:'numeric'}) + ' - ' + new Date(to).toLocaleDateString('en-US',{month:'short',year:'numeric'});
    document.getElementById('custDetails').innerHTML = `
      <b>Customer:</b> ${esc(c.name)}<br>
      <b>Contact No:</b> ${esc(c.phone || '-')}<br>
      <b>Date:</b> ${new Date().toLocaleDateString()}<br>
      <b>Address:</b> ${esc(c.address || '-')}
    `;

    const tbody = document.getElementById('txBody');
    if (!data.transactions.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No transactions in this period.</td></tr>';
    } else {
      tbody.innerHTML = data.transactions.map((tx, idx) => `
        <tr>
          <td>${idx+1}</td>
          <td>${new Date(tx.created_at).toLocaleDateString()}</td>
          <td>#${esc(tx.invoice_number)}</td>
          <td>$${tx.total.toFixed(2)}</td>
          <td>$${tx.due.toFixed(2)}</td>
        </tr>
      `).join('');
    }
    document.getElementById('foothTotal').textContent = '$' + data.total_amount.toFixed(2);
    document.getElementById('footDue').textContent = '$' + data.total_due.toFixed(2);
  } catch(e) {
    document.getElementById('txBody').innerHTML = '<tr><td colspan="5" class="empty-state">Customer not found.</td></tr>';
    console.error(e);
  }
}

loadStatement();
</script>


<!-- Floating + button (mobile only) -->
<div class="mobile-fab" onclick="window.location.href='/crm/sales-entry.html'">+</div>
</body>
</html>
