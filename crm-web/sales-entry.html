<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="manifest" href="/crm/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BioLabs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1B2A4A">
  <link rel="apple-touch-icon" href="/crm/assets/biolabs-logo.png">
  <link rel="icon" href="/crm/assets/biolabs-logo.png">
<title>BioLabs Research</title>
<link rel="stylesheet" href="crm.css?v=05fa5a1bda">
<style>
/* sales-entry-only styling; everything shared lives in crm.css */
.content{ flex:1; overflow-y:auto; padding:20px 24px; max-width:640px; }
.card{background:#fff;border:1px solid #E8ECF4;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
.card-title{font-size:13px;font-weight:700;color:#5A6685;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:#5A6685;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
.form-group input, .form-group select{width:100%;padding:10px 12px;border:1px solid #E8ECF4;border-radius:8px;font-size:13px;background:#F8FAFF;}
.form-group input:focus, .form-group select:focus{outline:none;border-color:#1F7A3D;background:#fff;}
.btn{ padding:10px 18px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:none; transition:all 0.15s; }
.btn-primary{ background:linear-gradient(135deg,#1F7A3D,#1B2A4A); color:#fff; width:100%; padding:14px; font-size:14px; }
.btn-primary:hover{ opacity:0.9; }
.btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
.btn-add-product{background:linear-gradient(135deg,#1F7A3D,#145C2C);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;}
.line-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F2FA;}
.line-item:last-child{border-bottom:none;}
.line-item-idx{width:22px;height:22px;background:#E8ECF4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#5A6685;flex-shrink:0;}
.line-item-name{flex:1;font-weight:600;}
.line-item-meta{font-size:11px;color:#5A6685;}
.line-item-total{font-weight:700;min-width:70px;text-align:right;}
.line-item-remove{color:#E53935;cursor:pointer;font-size:16px;padding:0 6px;}
.product-picker{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:2000;align-items:center;justify-content:center;}
.product-picker.open{display:flex;}
.picker-card{background:#fff;border-radius:16px;padding:20px;width:420px;max-height:70vh;overflow-y:auto;}
.picker-item{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid #F0F2FA;cursor:pointer;}
.picker-item:hover{background:#F8FAFF;}
.subtotal-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;color:#5A6685;}
.total-row{display:flex;justify-content:space-between;padding:12px 0;font-size:20px;font-weight:800;border-top:2px solid #E8ECF4;margin-top:8px;}
.due-badge{background:#FFF3E0;color:#E65100;padding:8px 14px;border-radius:8px;font-weight:700;text-align:right;margin-top:8px;}
.due-badge.zero{background:#E8F5E9;color:#2E7D32;}
#msgBox{padding:12px;border-radius:10px;margin-bottom:16px;display:none;font-weight:600;}
#msgBox.error{background:#FFEBEE;color:#C62828;display:block;}
#msgBox.success{background:#E8F5E9;color:#2E7D32;display:block;}
:root{--navy:#1B2A4A;--green:#1F7A3D;--bg:#F8FAFC;--border:#CBD5E1;--text:#0F172A;--muted:#475569;}
/* page-only mobile rules (the shared mobile layout is in crm.css) */
@media(max-width:768px){
.modal-card,.picker-card,.drawer,.modal{max-width:95vw!important;width:95vw!important}
.modal-overlay,.overlay{padding:10px!important}
.form-row{grid-template-columns:1fr!important;}
}
</style>

</head>
<body>

<div class="app-wrapper">
  <div class="sidebar">
    <div id="crm-nav" class="crm-nav"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Add Sale</div>
    </div>
    <div class="content">

      <div id="msgBox"></div>

      <div class="card">
        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="saleDate">
          </div>
          <div class="form-group">
            <label>Customer (optional)</label>
            <select id="customerSelect"><option value="walkin">Walk-in Customer</option></select>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div class="card-title" style="margin-bottom:0;">🛒 Products</div>
          <button class="btn btn-add-product" onclick="openPicker()">+ Add Product</button>
        </div>
        <div id="lineItems"><div class="empty-state" style="color:#5A6685;padding:20px 0;text-align:center;">No products added yet</div></div>
        <div class="subtotal-row"><span>Subtotal</span><span id="subtotalVal">$0.00</span></div>
      </div>

      <div class="card">
        <div class="total-row"><span>Total</span><span id="totalVal">$0.00</span></div>
        <div class="form-row" style="margin-top:14px;">
          <div class="form-group">
            <label>Payment Type</label>
            <select id="paymentType">
              <option>Cash</option><option>Bank Transfer</option><option>Zelle</option><option>Crypto</option><option>Credit Card</option>
            </select>
          </div>
          <div class="form-group">
            <label>Customer Paid</label>
            <input type="number" id="paidAmount" value="0" step="0.01" oninput="recalc()">
          </div>
        </div>
        <div class="due-badge zero" id="dueBadge">Due: $0.00</div>
      </div>

      <button class="btn btn-primary" id="saveBtn" onclick="saveSale()">Save Sale</button>
    </div>
  </div>
</div>

<!-- Product Picker Modal -->
<div class="product-picker" id="productPicker">
  <div class="picker-card">
    <h3 style="margin-bottom:14px;">Select a Product</h3>
    <div id="pickerList">Loading...</div>
    <button class="btn" style="width:100%;margin-top:10px;background:#E8ECF4;" onclick="closePicker()">Cancel</button>
  </div>
</div>

<script src="crm-utils.js"></script>
<script src="crm.js?v=d91d6eb09f"></script>
<script src="auth.js"></script>
<script>
renderNav('sales-entry');
const API = '/msolpeptides-api';

let PRODUCTS = [];
let LINE_ITEMS = [];


document.getElementById('saleDate').value = new Date().toISOString().slice(0,10);

// Phase 4 (2026-09-05): every call goes through api() from crm.js - Bearer header, JSON parsing, the 401 redirect and
// the error toast in one place. saveSale() keeps its own #msgBox message and asks api() not to toast on top of it.
async function loadCustomers() {
  try {
    const customers = await api(API + '/customers');
    const sel = document.getElementById('customerSelect');
    sel.innerHTML = customers.map(c => `<option value="${escAttr(c.id)}">${esc(c.name)}${c.balance > 0 ? ' (Due: $'+c.balance.toFixed(2)+')' : ''}</option>`).join('');
  } catch(e) { console.error(e); }
}

async function loadProducts() {
  try {
    PRODUCTS = (await api(API + '/products')).filter(p => p.is_active);
  } catch(e) { console.error(e); }
}

function openPicker() {
  const list = document.getElementById('pickerList');
  list.innerHTML = PRODUCTS.map(p => `
    <div class="picker-item" onclick="addProduct('${safeId(p.id)}')">
      <div><b>${esc(p.name)}</b><div style="font-size:11px;color:#5A6685;">Stock: ${esc(p.stock_qty)} unit${p.stock_qty===1?'':'s'}</div></div>
      <div style="font-weight:700;">$${esc(p.price)}</div>
    </div>
  `).join('');
  document.getElementById('productPicker').classList.add('open');
}
function closePicker() { document.getElementById('productPicker').classList.remove('open'); }

function addProduct(productId) {
  const product = PRODUCTS.find(p => p.id === productId);
  if (!product) return;
  const existing = LINE_ITEMS.find(li => li.product_id === productId);
  if (existing) { existing.qty += 1; }
  else { LINE_ITEMS.push({ product_id: productId, name: product.name, qty: 1, unit_price: product.price, max_qty: product.stock_qty }); }
  closePicker();
  renderLineItems();
}

function updateQty(idx, delta) {
  LINE_ITEMS[idx].qty = Math.max(1, Math.min(LINE_ITEMS[idx].max_qty, LINE_ITEMS[idx].qty + delta));
  renderLineItems();
}
function removeItem(idx) { LINE_ITEMS.splice(idx, 1); renderLineItems(); }

function renderLineItems() {
  const container = document.getElementById('lineItems');
  if (!LINE_ITEMS.length) {
    container.innerHTML = '<div class="empty-state" style="color:#5A6685;padding:20px 0;text-align:center;">No products added yet</div>';
  } else {
    container.innerHTML = LINE_ITEMS.map((li, idx) => `
      <div class="line-item">
        <div class="line-item-idx">${idx+1}</div>
        <div style="flex:1;">
          <div class="line-item-name">${esc(li.name)}</div>
          <div class="line-item-meta">
            <span onclick="updateQty(${idx},-1)" style="cursor:pointer;padding:0 6px;">−</span>
            x${esc(li.qty)}
            <span onclick="updateQty(${idx},1)" style="cursor:pointer;padding:0 6px;">+</span>
            · $${esc(li.unit_price)}
          </div>
        </div>
        <div class="line-item-total">$${(li.qty * li.unit_price).toFixed(2)}</div>
        <div class="line-item-remove" onclick="removeItem(${idx})">🗑</div>
      </div>
    `).join('');
  }
  recalc();
}

function recalc() {
  const subtotal = LINE_ITEMS.reduce((sum, li) => sum + li.qty * li.unit_price, 0);
  document.getElementById('subtotalVal').textContent = '$' + subtotal.toFixed(2);
  document.getElementById('totalVal').textContent = '$' + subtotal.toFixed(2);
  const paid = Number(document.getElementById('paidAmount').value) || 0;
  const due = Math.max(0, subtotal - paid);
  const badge = document.getElementById('dueBadge');
  badge.textContent = 'Due: $' + due.toFixed(2);
  badge.className = 'due-badge' + (due === 0 ? ' zero' : '');
}

document.getElementById('paidAmount').addEventListener('input', recalc);

async function saveSale() {
  const msgBox = document.getElementById('msgBox');
  msgBox.className = ''; msgBox.style.display = 'none';

  if (!LINE_ITEMS.length) {
    msgBox.className = 'error'; msgBox.textContent = 'Add at least one product before saving.'; return;
  }
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving...';

  const user = (window.CRM_CURRENT_USER && window.CRM_CURRENT_USER.name) || 'unknown';
  const payload = {
    customer_id: document.getElementById('customerSelect').value,
    line_items: LINE_ITEMS.map(li => ({ product_id: li.product_id, qty: li.qty, unit_price: li.unit_price })),
    payment_type: document.getElementById('paymentType').value,
    paid_amount: Number(document.getElementById('paidAmount').value) || 0,
    user
  };

  try {
    const data = await api(API + '/sales', { method: 'POST', body: payload, toast: false });
    msgBox.className = 'success'; msgBox.textContent = `Sale #${data.sale.invoice_number} saved! Total: $${data.sale.total.toFixed(2)}`;
    LINE_ITEMS = [];
    renderLineItems();
    document.getElementById('paidAmount').value = 0;
    loadProducts(); // refresh stock levels
    loadCustomers();
    saveBtn.disabled = false; saveBtn.textContent = 'Save Sale';
    setTimeout(() => { window.location.href = '/crm/sales-dashboard.html'; }, 1200);
  } catch(e) {
    // e.status: 0 = the server was unreachable, undefined = a local error; anything else carries the server's own text
    msgBox.className = 'error'; msgBox.textContent = e.status ? (e.message || 'Failed to save sale.') : 'Network error. Please try again.';
    saveBtn.disabled = false; saveBtn.textContent = 'Save Sale';
  }
}

loadCustomers();
loadProducts();
</script>


<!-- Floating + button (mobile only) -->
<div class="mobile-fab" onclick="window.location.href='/crm/sales-entry.html'">+</div>
</body>
</html>
