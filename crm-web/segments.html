<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/crm/manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="apple-touch-icon" href="/crm/assets/biolabs-logo.png">
<link rel="icon" href="/crm/assets/biolabs-logo.png">
<title>BioLabs Research</title>
<link rel="stylesheet" href="crm.css?v=05fa5a1bda">
<style>
/* segments-only styling; everything shared lives in crm.css */
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#E8ECF4;color:#1a1a2e;font-size:13px;display:flex;height:100vh;overflow:hidden;}
.logo-img{width:42px;height:42px;border-radius:12px;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,#1F7A3D,#1B2A4A);}
.card{background:#fff;border:1px solid #E8ECF4;border-radius:14px;padding:20px 22px;margin-bottom:16px;}
.card h3{font-size:14px;font-weight:700;margin-bottom:14px;color:#1B2A4A;}
.empty{text-align:center;padding:48px 20px;color:#5A6685;}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.6;}
.empty-title{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:6px;}
.toast{position:fixed;bottom:28px;right:28px;background:#1a1a2e;color:#fff;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none;}
thead th{text-align:left;padding:10px 8px;font-size:11px;font-weight:600;color:#5A6685;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #E8ECF4;}
tbody td{padding:10px 8px;font-size:13px;border-bottom:1px solid #F0F2FA;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-green{background:#E8F5E9;color:#2E7D32;}
.badge-gray{background:#E8ECF4;color:#5A6685;}
.badge-amber{background:#FFF8EC;color:#D97706;}
.badge-red{background:#FEF2F2;color:#C62828;}
.health{width:10px;height:10px;border-radius:50%;display:inline-block;}
.health.green{background:#0E9F6E;}
.health.yellow{background:#F59E0B;}
.health.red{background:#E02424;}
.grid-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.auto-card{background:#fff;border:1px solid #E8ECF4;border-radius:14px;padding:18px 20px;}
.auto-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.auto-name{font-size:14px;font-weight:700;color:#1a1a2e;}
.auto-desc{font-size:12px;color:#5A6685;line-height:1.5;margin:8px 0 14px;}
.rules{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.rule-row{display:grid;grid-template-columns:1.2fr .8fr 1fr auto;gap:8px;align-items:center;}
.seg-list{display:flex;flex-direction:column;gap:8px;}
.seg-item{border:1px solid #E8ECF4;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
.note{font-size:12px;color:#5A6685;margin-top:8px;}
:root{--navy:#1B2A4A;--green:#1F7A3D;--border:#CBD5E1;--muted:#475569;}
/* page-only mobile rules (the shared mobile layout is in crm.css) */
@media(max-width:768px){
.sidebar-logo,.nav-section-label,.sidebar-spacer,.nav-mobile-hidden{display:none!important;}
.grid-cards{grid-template-columns:1fr;}
.rule-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<script src="crm-utils.js"></script>
<script src="crm.js?v=d91d6eb09f"></script>
<script src="auth.js"></script>
<div class="app-wrapper">
<aside class="sidebar">
  <div id="crm-nav" class="crm-nav"></div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="topbar-title">🎯 Segments <span>Audience builder</span></div>
  </header>
  <div class="content">

<div class="card">
  <h3>🎯 Segment builder</h3>
  <p class="note">Only these fields can be used: country, purchase history (product category, order count, total spent), email engagement (opens / clicks), account age, last order date.</p>
  <div class="field"><label>Segment name</label><input id="seg-name" placeholder="e.g. Italy clinics, 2+ orders"></div>
  <div class="rules" id="rules"></div>
  <button class="btn btn-secondary" type="button" onclick="addRule()">+ Add condition</button>
  <button class="btn btn-primary" type="button" onclick="saveSegment()">Save segment</button>
  <p class="note" id="seg-msg"></p>
</div>
<div class="card">
  <h3>Saved segments</h3>
  <div class="seg-list" id="seg-list"><div class="note">Loading…</div></div>
</div>

  </div>
</div>
</div>
<script>
renderNav('segments');
const API='/api';
async function cioStatus(){
  try{
    // {toast:false}: a missing Customer.io is not an error here - the page shows its own "Connect Customer.io" card
    const d=await api(API+'/cio/status',{toast:false});
    return d || {configured:false};
  }catch(e){ return {configured:false}; }
}

const FIELDS = [
  {v:'country', l:'Country'},
  {v:'product_category', l:'Product category'},
  {v:'order_count', l:'Order count'},
  {v:'total_spent', l:'Total spent'},
  {v:'email_opens', l:'Email opens'},
  {v:'email_clicks', l:'Email clicks'},
  {v:'account_age_days', l:'Account age (days)'},
  {v:'last_order_date', l:'Last order date'}
];
const OPS = [
  {v:'eq', l:'is'},
  {v:'neq', l:'is not'},
  {v:'in', l:'is one of'},
  {v:'gte', l:'≥'},
  {v:'lte', l:'≤'},
  {v:'after', l:'after'},
  {v:'before', l:'before'}
];
let editingId = null;
function addRule(pre){
  const row=document.createElement('div');
  row.className='rule-row';
  row.innerHTML = `
    <select class="rf">${FIELDS.map(f=>`<option value="${escAttr(f.v)}">${esc(f.l)}</option>`).join('')}</select>
    <select class="ro">${OPS.map(o=>`<option value="${escAttr(o.v)}">${esc(o.l)}</option>`).join('')}</select>
    <input class="rv" placeholder="Value">
    <button class="btn btn-danger" type="button" onclick="this.parentNode.remove()">✕</button>`;
  if(pre){
    row.querySelector('.rf').value = pre.field;
    row.querySelector('.ro').value = pre.op;
    row.querySelector('.rv').value = Array.isArray(pre.value)? pre.value.join(', ') : (pre.value??'');
  }
  document.getElementById('rules').appendChild(row);
}
function collectRules(){
  return [...document.querySelectorAll('.rule-row')].map(r=>({
    field: r.querySelector('.rf').value,
    op: r.querySelector('.ro').value,
    value: r.querySelector('.rv').value
  }));
}
async function loadSegments(){
  const box=document.getElementById('seg-list');
  try{
    // {toast:false}: the catch below writes "Could not load segments." into the card itself
    const d=await api(API+'/segments',{toast:false});
    const segs=d.segments||[];
    if(!segs.length){ box.innerHTML='<div class="note">No segments saved yet.</div>'; return; }
    box.innerHTML = segs.map(s=>`
      <div class="seg-item">
        <div>
          <div style="font-weight:700">${esc(s.name)}</div>
          <div class="note">${esc((s.rules||[]).map(x=>x.field+' '+x.op+' '+x.value).join(' · ')||'No rules')}</div>
        </div>
        <button class="btn btn-secondary" onclick='editSeg(${escAttr(JSON.stringify(s))})'>Edit</button>
      </div>`).join('');
  }catch(e){ box.innerHTML='<div class="note">Could not load segments.</div>'; }
}
function editSeg(s){
  editingId=s.id;
  document.getElementById('seg-name').value=s.name||'';
  document.getElementById('rules').innerHTML='';
  (s.rules||[]).forEach(addRule);
  document.getElementById('seg-msg').textContent='Editing '+s.name;
}
async function saveSegment(){
  const name=document.getElementById('seg-name').value.trim();
  const rules=collectRules();
  if(!name){ showToast('Name required','error'); return; }
  const url = editingId ? API+'/segments/'+editingId : API+'/segments';
  const method = editingId ? 'PUT' : 'POST';
  try{
    const d=await api(url,{method,body:{name,rules}});
    if(!d||!d.ok){ showToast((d&&d.error)||'Save failed','error'); return; }
    showToast('Segment saved','success');
    editingId=null;
    document.getElementById('seg-name').value='';
    document.getElementById('rules').innerHTML='';
    addRule();
    loadSegments();
  }catch(e){ /* api() already showed the reason */ }
}
addRule();
loadSegments();

</script>
</body>
</html>
